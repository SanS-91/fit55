name: Unblock stalled Pages deployment (one-time)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/unblock-pages.yml
permissions:
  contents: read
  pages: write
jobs:
  cancel-stale-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale Pages build version once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HTTP_CODE=$(curl -sS -o /tmp/response.txt -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/SanS-91/fit55/pages/deployments/7001818e4911906f6568997ad4d4ed593947ec6f/cancel")
          echo "Pages cancellation HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" = "204" ]; then
            echo "Stalled deployment cancellation accepted."
          elif [ "$HTTP_CODE" = "404" ]; then
            echo "Deployment not found (perhaps already cleared)."
          else
            cat /tmp/response.txt
            exit 1
          fi
