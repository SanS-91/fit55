name: Pages deployment diagnostics and queued-run cleanup
on:
  push:
    paths:
      - .github/workflows/pages-diagnostics.yml
permissions:
  contents: read
  pages: read
  actions: write
  deployments: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Pages deployment state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          echo '--- Pages site ---'
          gh api repos/SanS-91/fit55/pages --jq '{status,build_type,source,html_url}' || true
          echo '--- Last environment deployments ---'
          gh api 'repos/SanS-91/fit55/deployments?per_page=15' --jq '.[] | {id,sha,environment,created_at}' || true
          echo '--- Old queued Pages run ---'
          STATUS=$(gh api repos/SanS-91/fit55/actions/runs/41288509964 --jq '.status' || true)
          echo "Run 41288509964 status: $STATUS"
          if [ "$STATUS" = "queued" ] || [ "$STATUS" = "in_progress" ]; then
            echo '--- Request force-cancel of old stuck run ---'
            gh api --method POST repos/SanS-91/fit55/actions/runs/41288509964/force-cancel || true
          fi
