name: Clear failed Pages deployment lock
on:
  push:
    paths:
      - .github/workflows/clear-pages-lock.yml
permissions:
  contents: read
  pages: write
jobs:
  clear-stalled-version:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect and cancel only the failed Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Inspecting Pages deployment ddc661a8c03d08de11895fc3b17aa509e47eb188"
          gh api repos/SanS-91/fit55/pages/deployments/ddc661a8c03d08de11895fc3b17aa509e47eb188 || true
          HTTP_CODE=$(curl -sS -o /tmp/cancel-result -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/SanS-91/fit55/pages/deployments/ddc661a8c03d08de11895fc3b17aa509e47eb188/cancel")
          echo "Cancel targeted stalled deployment: HTTP $HTTP_CODE"
          cat /tmp/cancel-result
          echo
          if [ "$HTTP_CODE" != "204" ]; then
            echo "The API did not accept cancellation; no other deployments were changed."
            exit 1
          fi
